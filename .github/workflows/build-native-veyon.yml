name: Build BIMLeman Native Veyon Master
on:
  push:
    branches: [feature/veyon-native-bimleman]
    paths: ['native-update/**', '!native-update/evidence/**', '!native-update/README.md', '!native-update/patches/**', 'assets/brand/**', '.github/workflows/build-native-veyon.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-veyon-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CI_COMMIT_TAG: v4.11.3
      VEYON_SOURCE: upstream-veyon
      REDISTRIBUTION_AUTHORIZED: ${{ vars.BIMLEMAN_INTERCEPTION_REDISTRIBUTION == 'authorized' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned native sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/veyon/veyon.git upstream-veyon
          if ($LASTEXITCODE) { throw 'Veyon clone failed' }
          git -C upstream-veyon checkout --detach 0c629d9931810a5974038fc1a207d52fbd0e65f6
          if ($LASTEXITCODE) { throw 'Veyon revision missing' }
          git -C upstream-veyon submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { throw 'Veyon submodule failure' }
          git clone https://github.com/oblitum/Interception.git interception
          if ($LASTEXITCODE) { throw 'Interception clone failed' }
          git -C interception checkout --detach 39eecbbc46a52e0402f783b872ef62b0254a896a
          if ($LASTEXITCODE) { throw 'Interception revision missing' }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: false
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native-packages
        with:
          path: native-packages
          key: mingw64-${{ runner.os }}-${{ hashFiles('native-update/msys2-lock.json') }}
      - name: Fetch checksum-locked Qt and native dependencies
        shell: pwsh
        run: ./native-update/Install-BuildDependencies.ps1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.native-packages.outputs.cache-hit != 'true'
        with:
          path: native-packages
          key: mingw64-${{ runner.os }}-${{ hashFiles('native-update/msys2-lock.json') }}
      - name: Install locked packages
        shell: msys2 {0}
        run: pacman -U --noconfirm native-packages/*.pkg.tar.zst
      - name: Configure and compile real Veyon Master
        shell: msys2 {0}
        run: bash native-update/build.sh
      - name: Compile all native plugins and components
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build native-build --parallel 2 2>&1 | tee native-output/evidence/build-all.log
      - name: Package native runtime, installer and corresponding sources
        shell: msys2 {0}
        run: |
          export PATH="/c/Program Files/Git/cmd:$PATH"
          export MINGW_PREFIX="$(cygpath -m "$MINGW_PREFIX")"
          python native-update/package_native.py
      - name: Test isolated Windows installation and rollback
        shell: pwsh
        run: ./native-update/Test-NativeInstaller.ps1
      - name: Upload native installer, runtime and corresponding sources
        if: vars.BIMLEMAN_INTERCEPTION_REDISTRIBUTION == 'authorized'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BIMLeman-Native-Veyon-Candidate
          path: |
            native-output/*setup.exe
            native-output/*sources.tar.gz
            native-output/manifest.json
            native-output/Install-Safe.ps1
            native-output/Uninstall-Safe.ps1
            native-output/Get-VeyonInstallation.ps1
          if-no-files-found: error
      - name: Preserve complete build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BIMLeman-Native-Veyon-Evidence
          path: |
            native-output/evidence/
            native-build/CMakeCache.txt
            native-build/CMakeFiles/CMakeConfigureLog.yaml
            native-build/translations/CMakeFiles/*.bat
            native-build/translations/*lupdate*.txt
          if-no-files-found: warn
