name: Windows Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path deploy -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($err in $errors) {
                Write-Output "$($err.Extent.File):$($err.Extent.StartLineNumber): $($err.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis
          tagName: bimleman-v__VERSION__
          releaseName: BIMLéman View Room v__VERSION__
          releaseBody: Installateur Windows NSIS généré automatiquement. Aucune clé privée n'est incluse.
          releaseDraft: true
          prerelease: false
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BIMLeman-View-Room-Setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
