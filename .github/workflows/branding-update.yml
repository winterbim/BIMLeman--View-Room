name: BIMLeman native launcher update
on:
  workflow_dispatch:
  push:
    branches: [feature/veyon-native-bimleman]
    paths:
      - 'native-update/**'
      - '.github/workflows/branding-update.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate icon from repository logo
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; Image.open('assets/brand/BIMLeman-View-Room-logo.png').convert('RGBA').save('native-update/brand.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build Windows launcher
        shell: pwsh
        run: dotnet publish native-update/BIMLemanLauncher.csproj -c Release -o native-update/publish
      - name: Build NSIS updater
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & 'C:\Program Files (x86)\NSIS\makensis.exe' 'native-update\BIMLeman.nsi'
      - uses: actions/upload-artifact@v4
        with:
          name: BIMLeman-View-Room-Update
          path: native-update/BIMLeman-View-Room-Update.exe
          if-no-files-found: error