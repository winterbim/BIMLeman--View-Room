name: Inspect native Veyon branding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream Veyon source
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/veyon/veyon.git upstream-veyon
      - name: Inspect and patch Master UI labels
        shell: pwsh
        run: |
          python native-update/prepare_native.py --source upstream-veyon --logo assets/brand/BIMLeman-View-Room-logo.png --report native-update/native-branding-report.json
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-branding-inspection
          path: native-update/native-branding-report.json
          if-no-files-found: warn
